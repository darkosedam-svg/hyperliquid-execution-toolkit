[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyperliquid-execution-toolkit"
version = "0.1.0"
description = "Production-grade execution primitives for Hyperliquid perpetuals"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Darko Vlahovic"},
]
keywords = ["hyperliquid", "trading", "perpetuals", "execution", "crypto"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "websockets>=12.0",
    "msgspec>=0.18",
    "eth-account>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
]

[project.urls]
Homepage = "https://github.com/darkosedam-svg/hyperliquid-execution-toolkit"
Issues = "https://github.com/darkosedam-svg/hyperliquid-execution-toolkit/issues"
Documentation = "https://github.com/darkosedam-svg/hyperliquid-execution-toolkit#readme"

[tool.hatch.build.targets.wheel]
packages = ["hl_exec"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
